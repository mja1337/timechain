<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090c0d">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/timechain/favicon.svg">
  <title>Block not found - Timechain</title>
  <style>
    html,body{margin:0;min-height:100%;background:#090c0d;color:#e7ecea;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    main{max-width:520px;margin:0 auto;padding:12vh 20px 40px}
    .coin{width:56px;height:56px;border-radius:50%;background:#f7931a;color:#090c0d;display:grid;place-items:center;font-size:38px;font-weight:800;margin-bottom:24px}
    h1{margin:0 0 10px;font-size:26px}
    p{margin:0 0 20px;color:#c8d3cf}
    a.go{display:inline-block;padding:12px 18px;background:#f7931a;color:#090c0d;font-weight:700;text-decoration:none;border-radius:4px}
    a.go:focus-visible{outline:2px solid #e7ecea;outline-offset:3px}
    small{display:block;margin-top:28px;color:#8d9a97;font:12px/1.5 ui-monospace,Menlo,monospace}
  </style>
</head>
<body>
  <main>
    <div class="coin" aria-hidden="true">₿</div>
    <h1>No block at this height</h1>
    <p>There is nothing at this address. The game lives at the main page, and your run is still saved in this browser.</p>
    <a class="go" href="/timechain/">Back to the game</a>
    <small>404 · not found</small>
  </main>
</body>
</html>
